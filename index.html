    <script>
      // Garde-fou "site mis à jour pendant que la page était en cache".
      // GitHub Pages peut servir un ancien index.html (cache ~10 min) qui pointe
      // vers des fichiers /assets/ déjà remplacés par un déploiement : le JS
      // renvoie alors 404 et la page reste blanche. Dans ce cas on recharge UNE
      // fois avec un paramètre ?_r=... (autre adresse = pas de cache) : les
      // autres paramètres (retrobat, system, boutons manette, agent...) sont
      // conservés. Au plus un rechargement par minute, donc jamais de boucle.
      (function () {
        var KEY = 'hyperbat_asset_reload';
        var url;
        try {
          url = new URL(window.location.href);
          if (url.searchParams.has('_r')) {
            url.searchParams.delete('_r');
            window.history.replaceState(null, '', url.pathname + url.search + url.hash);
          }
        } catch (e) { /* on continue sans nettoyage d'adresse */ }

        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var src = t.src || t.href || '';
          if (src.indexOf('/assets/') === -1) return;
          try {
            var last = parseInt(sessionStorage.getItem(KEY) || '0', 10);
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (err) { return; }
          try {
            var next = new URL(window.location.href);
            next.searchParams.set('_r', String(Date.now()));
            window.location.replace(next.toString());
          } catch (err2) { window.location.reload(); }
        }, true);
      })();
    </script>
